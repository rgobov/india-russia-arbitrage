spring.application.name=arbitrage
# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mariadb://localhost:3307/arb
spring.datasource.username=arb_user
spring.datasource.password=arb_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# JPA & HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ===============================
# DISRUPTOR CONFIGURATION
# ===============================
disruptor.buffer-size=4096
disruptor.wait-strategy=busy-spin
disruptor.producer-type=multi

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE