version: '3.8'

services:
  mariadb:
    image: mariadb:10.6
    container_name: arb-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: arb
      MYSQL_USER: arb_user
      MYSQL_PASSWORD: arb_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

volumes:
  mariadb_data: